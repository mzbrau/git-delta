name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: write
  checks: write

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/GitDelta.slnx

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          dotnet build src/GitDelta.slnx -c Release --no-restore 2>&1 | tee build.log

      - name: Test
        run: >
          dotnet test src/GitDelta.slnx -c Release --no-build
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults
          --logger "trx;LogFileName=test-results.trx"
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: Publish test report
        uses: mzbrau/actions-insights@v1
        if: always()
        continue-on-error: true
        with:
          test-results: 'TestResults/**/*.trx'
          coverage-enabled: true
          coverage-files: '**/coverage.opencover.xml'
          diagnostics-enabled: true
          diagnostics-files: 'build.log'
          history-enabled: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          history-repository: 'mzbrau/mzbrau-actions-insights'
          history-token: ${{ secrets.ACTIONS_INSIGHTS_HISTORY_TOKEN }}

      - name: Coverage floor (GitHub / Review / Persistence)
        shell: pwsh
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator `
            -reports:"TestResults/**/coverage.opencover.xml" `
            -targetdir:"TestResults/coverage-report" `
            -reporttypes:"TextSummary"
          $summary = Get-Content "TestResults/coverage-report/Summary.txt" -Raw
          Write-Host $summary
          function Get-LineRate($assembly) {
            $escaped = [regex]::Escape($assembly)
            if ($summary -match "(?m)^$escaped\s+([\d\.]+)%") { return [double]$Matches[1] }
            return 0
          }
          $floors = @{
            "GitDelta.GitHub" = 40
            "GitDelta.Review" = 40
            "GitDelta.Persistence" = 40
          }
          $failures = @()
          foreach ($entry in $floors.GetEnumerator()) {
            $rate = Get-LineRate $entry.Key
            Write-Host "$($entry.Key): $rate% (floor $($entry.Value)%)"
            if ($rate -lt $entry.Value) {
              $failures += "$($entry.Key) line coverage $rate% is below floor $($entry.Value)%"
            }
          }
          if ($failures.Count -gt 0) {
            Write-Error ($failures -join "; ")
            exit 1
          }

      - name: Publish win-x64
        run: >
          dotnet publish src/GitDelta.App/GitDelta.App.csproj -c Release
          -r win-x64 --self-contained true -o ./artifacts/win-x64

      - name: Publish win-arm64
        run: >
          dotnet publish src/GitDelta.App/GitDelta.App.csproj -c Release
          -r win-arm64 --self-contained true -o ./artifacts/win-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: windows-builds
          path: artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: TestResults/coverage-report/
          if-no-files-found: ignore
