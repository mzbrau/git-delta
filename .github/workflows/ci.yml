name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/CodeReviewr.slnx

      - name: Build
        run: dotnet build src/CodeReviewr.slnx -c Release --no-restore

      - name: Test
        run: >
          dotnet test src/CodeReviewr.slnx -c Release --no-build
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults
          --logger "trx;LogFileName=test-results.trx"

      - name: Publish win-x64
        run: >
          dotnet publish src/CodeReviewr.App/CodeReviewr.App.csproj -c Release
          -r win-x64 --self-contained true -o ./artifacts/win-x64

      - name: Publish win-arm64
        run: >
          dotnet publish src/CodeReviewr.App/CodeReviewr.App.csproj -c Release
          -r win-arm64 --self-contained true -o ./artifacts/win-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: windows-builds
          path: artifacts/
